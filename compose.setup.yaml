# One-time database initialization. Requires the configure step to have run
# first (it writes init.sql into the `initdb` volume):
#
#   docker compose -f compose.yaml -f compose.setup.yaml up postgresql
#
services:
  postgresql:
    volumes:
      - postgres:/var/lib/postgresql/data
      - initdb:/docker-entrypoint-initdb.d:ro
    # During setup we only want Postgres to run its init scripts (init.sql)
    # once against the fresh data volume, then exit — so `compose up` returns
    # on its own instead of leaving a server running in the foreground.
    healthcheck:
      disable: true
    entrypoint:
      - bash
      - -c
      - |
        docker-entrypoint.sh postgres &
        pid=$$!
        # The temporary init server only listens on the unix socket, so a
        # successful TCP check means init finished and the real server is up.
        until pg_isready -h 127.0.0.1 -q; do sleep 1; done
        echo 'Postgres initialized — stopping setup instance.'
        kill -INT "$$pid"
        wait "$$pid"

  #kratos:
  #  command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier

volumes:
  initdb:
