# Interactive first-time configuration.
# Runs the Bun setup script in a throwaway container.
#
#   docker compose -f compose.configure.yaml run --rm configure
#
# It writes .env to the repo (via the bind mount)
name: devguard

services:
  configure:
    image: oven/bun:${BUN_TAG}
    working_dir: /app
    volumes:
      - ./:/app
      - encryption-key:/keys
      - kratos-config:/kratos
      - initdb:/initdb
    command: ["bun", "run", "dev/setup.ts"]

volumes:
  encryption-key:
  kratos-config:
  initdb:
